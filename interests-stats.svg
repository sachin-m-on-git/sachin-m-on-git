<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 224" width="1024" height="224" role="img" aria-label="Interests and stats"><defs></defs><style>
.fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl2 3.6s ease-in-out infinite}
.bob{animation:bob 2.2s ease-in-out infinite}
.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:glow 4s ease-in-out infinite}
.pop{animation:pop 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sway2{animation:sway2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 8s linear infinite}
.draw{stroke-dasharray:180;animation:draw 3.6s ease-in-out infinite}
.cyc{opacity:0;animation:cyc 12s infinite}
.slide{animation:slide 1s ease-out both}
.zoom{animation:zoom 10s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fl2{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes glow{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
@keyframes pop{0%,14%,100%{transform:scale(1)}7%{transform:scale(1.14)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes sway2{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-340px);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:180}45%,100%{stroke-dashoffset:0}}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes slide{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes zoom{to{transform:scale(1.08)}}
@keyframes shine{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1400px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="1024" height="224" fill="#090720"/><rect x="14" y="10" width="636" height="200" rx="18" fill="#120d33" stroke="#4b34b8" stroke-width="1.6" class="glow" /><rect x="662" y="10" width="348" height="200" rx="18" fill="#120d33" stroke="#4b34b8" stroke-width="1.6" class="glow" />
